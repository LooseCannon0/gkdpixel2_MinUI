# Fast-boot audio routing.
# The distro's 99-pipewire-default.conf points ALSA defaults at the PipeWire
# daemon, which does not run in fast-boot mode. Two fixes:
#
# 1) Default *mixer* goes to the real codec (this file loads after alsa.conf.d,
#    so it wins over the pipewire override).
ctl.!default {
    type hw
    card 0
}

# 2) A software-volume pcm for MinUI. Its 'MinUI Volume' control is created by
#    ALSA itself and scales this exact stream — so the volume slider works no
#    matter what controls this kernel's codec driver does or doesn't expose.
pcm.minui {
    type softvol
    slave.pcm "plughw:0,0"
    control {
        name "MinUI Volume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 101
}
