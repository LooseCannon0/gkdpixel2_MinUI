# Fast-boot audio routing — fast mode only.
# Installed as /usr/share/fastboot/asound.conf. After the rescue check, fastinit
# copies it to /run/asound.conf, which ROCKNIX's alsa.conf loads after
# alsa.conf.d and /etc/asound.conf (or bind-mounts it over /etc/asound.conf if
# alsa.conf lacks that entry). Rescue mode (stock systemd + PipeWire) never sees
# it and keeps the distro's own routing.
#
# The distro's 99-pipewire-default.conf points the ALSA defaults at the PipeWire
# daemon, which doesn't run in fast mode; these '!' overrides win because this
# file loads after it.

# 1) Default *mixer* goes to the real codec.
ctl.!default {
    type hw
    card 0
}

# 2) A software-volume pcm for MinUI. Its 'MinUI Volume' control is created by
#    ALSA itself the first time the pcm is opened, and it scales this exact
#    stream — the codec exposes no hardware volume control at all.
pcm.minui {
    type softvol
    slave.pcm "plughw:0,0"
    control {
        name "MinUI Volume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 101
}

# 3) Default *pcm* goes through the same softvol, so programs that just open
#    "default" (e.g. mpv in the Music pak) get sound and follow the volume keys.
#    'plug' converts whatever format they ask for into one softvol accepts.
pcm.!default {
    type plug
    slave.pcm "minui"
}
